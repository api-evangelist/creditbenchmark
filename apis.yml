name: Credit Benchmark
description: Credit Benchmark is a financial data company that aggregates internal credit risk assessments
  contributed by more than 40 leading global financial institutions into anonymized, consensus Credit
  Consensus Ratings and analytics covering roughly 120,000 public and private entities — over 90% of which
  are unrated by the traditional credit rating agencies. Its REST API delivers consensus ratings, rating
  distributions, aggregate credit trends, entity rating changes, and portfolio analytics, along with entity-name-to-CBID
  resolution (matching) and contributor-data analytics. Delivery is also available via a web app, an Excel
  Add-In, and file/SFTP feeds. Access is enterprise/sales-gated; the JWT-authenticated API base is https://api.creditbenchmark.com.
