  /matching/match:
    post:
      tags:
        - Entity Matching
      summary: Entity Name Matching
      description: |
        Return ranked entity matches.
      operationId: matchEntities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchBody'
            example:
              queries:
                - text: JPMorgan Chase & Co.
                  industry: Financials
                  country_name: United States
                - text: Apple Inc.
                  lei: 5493000X0X4X4X4X4X4X
      responses:
        '200':
          description: Entity matching completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchExternalResponse'
              example:
                results:
                  - entity: JPMorgan Chase
                    candidates:
                      - rank: 1
                        CBId: CB0000022706
                        CBEntityName: JPMORGAN CHASE & CO
                        CBCountryOfRiskISO: US
                        isConsensus1M: true
                        confidence: 0.82
                      - rank: 2
                        CBId: CB0000118034
                        CBEntityName: JJPMORGAN CHASE BANK NA
                        CBCountryOfRiskISO: US
                        isConsensus1M: true
                        confidence: 0.09
                  - entity: Apple Inc.
                    candidates:
                      - rank: 1
                        CBId: CB0000000456
                        CBEntityName: APPLE INC
                        CBCountryOfRiskISO: US
                        isConsensus1M: true
                        confidence: 0.97
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
