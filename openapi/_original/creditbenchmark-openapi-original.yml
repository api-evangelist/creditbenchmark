          description: Consensus rating change in notches
          example:
            - -1
            - 0
            - -2
            - -1
            - -1
        ClientRating:
          type: array
          items:
            type: string
          description: Current client internal rating (empty string if not available)
          example:
            - ''
            - ''
            - bb-
            - ''
            - bbb-
        ClientRating6M:
          type: array
          items:
            type: string
          description: Client internal rating 6 months ago (empty string if not available)
          example:
            - ''
            - ''
            - bb+
            - ''
            - bbb-
        ClientPD:
          type: array
          items:
            type: number
            format: float
          description: Current client probability of default (0.0 if not available)
          example:
            - 0
            - 0
            - 0.0165
            - 0
            - 0.0037
        ClientPD6M:
          type: array
          items:
            type: number
            format: float
          description: Client probability of default 6 months ago (0.0 if not available)
          example:
            - 0
            - 0
            - 0.0063
            - 0
            - 0.0037
        client_rating_change:
          type: array
          items:
            type: number
            format: float
          description: Client rating change in notches (0.0 if not available)
          example:
            - 0
            - 0
            - -2
            - 0
            - 0
    Query:
      type: object
      description: A single entity name query for matching
      required:
        - text
      properties:
        text:
          type: string
          description: The company name to match
          example: JPMorgan Chase & Co.
        industry:
          type: string
          description: Optional industry filter to improve matching accuracy
          example: Financials
        lei:
          type: string
          description: Optional Legal Entity Identifier (LEI) for exact matching
          example: 5493000X0X4X4X4X4X4X
        country_name:
          type: string
          description: Optional country name or code to filter matches
          example: United States
    MatchBody:
      type: object
      description: Request body for entity name matching
      required:
        - queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/Query'
          description: List of company names to match
          minItems: 1
    ExternalCandidate:
      type: object
      description: A ranked candidate match for an entity query
      required:
        - rank
        - CBId
        - CBEntityName
        - confidence
      properties:
        rank:
          type: integer
          description: 1-based rank of the candidate (1 = best match)
          minimum: 1
          example: 1
        CBId:
          type: string
          description: Credit Benchmark entity identifier
          example: CB0000000121
        CBEntityName:
          type: string
          description: Credit Benchmark entity name
          example: JPMorgan Chase & Co.
        CBCountryOfRiskISO:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: US
        isConsensus1M:
          type: boolean
          description: Whether the entity has a 1-month consensus rating
          example: true
        confidence:
          type: number
          format: float
          description: Confidence score for the match (0.0 to 1.0)
          minimum: 0
          maximum: 1
          example: 0.98
    ExternalMatchRow:
      type: object
      description: Matching results for a single entity query
      required:
        - entity
        - candidates
      properties:
        entity:
          type: string
          description: Original query text
          example: JPMorgan Chase & Co.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCandidate'
          description: Ordered list of candidate matches, sorted by rank
          default: []
    MatchExternalResponse:
      type: object
      description: Response containing entity matching results
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalMatchRow'
          description: Table-style results keyed by input entity
          default: []
    ResponseMetadata:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
          description: Generation timestamp
          example: '2024-10-24T15:30:00Z'
        api_version:
          type: string
          description: API version
          example: 1.0.0
        request_id:
          type: string
          description: Request identifier
          example: req_123456
    Error:
      type: object
      description: Standard error envelope used by the API
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: BAD_REQUEST
            message:
              type: string
              description: Human-readable error message
              example: Invalid request parameters
            details:
              description: Optional structured details about the error
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ValidationErrorDetail'
                - type: object
                - type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token.
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid request parameters
              details:
                invalid_columns:
                  - BadColumn
                allowed_columns: Please check documentation for valid column names
    Unauthorized:
      description: Unauthorized - invalid or missing JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid or missing JWT token
    Forbidden:
      description: Forbidden - insufficient permissions or access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PERMISSION_DENIED
              message: Insufficient permissions for this resource
    ValidationError:
      description: Validation error - request parameters are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: body.Parameters.portfolio
                  message: field required
                  type: value_error.missing
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred.
servers:
  - url: https://api.creditbenchmark.com
    description: Production server
security:
  - BearerAuth: []
tags:
  - name: Authentication
    description: JWT token generation and authentication
  - name: Analytics
    description: Portfolio analytics and risk calculations
  - name: Entity Data
    description: Entity-specific data and rating information
  - name: Portfolio Analytics
    description: Portfolio-level analytics and summaries
  - name: Entity Matching
    description: Entity name matching and identification
  - name: Contributor Data
    description: >-
      Contributor-specific analytics using client/bank internal PD data.
      Requires ent_CLIENT-DATA entitlement.
